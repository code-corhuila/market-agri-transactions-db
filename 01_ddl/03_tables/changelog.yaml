databaseChangeLog:
  - changeSet:
      id: ddl-tables-001
      author: contreras-elkin
      labels: "HU-PLAT-006,ddl,tables"
      comment: "payment_transaction - one payment for a quantity of a product (I-06), with the Wompi fields of ADR-019."
      changes:
        - sqlFile:
            path: 001_create_payment_transaction.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
